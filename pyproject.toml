[project]
name = "ee-status"
version = "0.1.0"
description = "Displaying data from the German Marktstammdatenregister"
readme = "README.md"
license = { text = "GPLv3" }
authors = [
  { name = "Finn Hees", email = "finn.hees@ee-status.de" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.3",
  "django==6.1",
  "django-allauth[mfa]==65.19.1",
  "django-anymail==15.1",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-filter==26.1",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "pillow==12.3.0",
  "plotly==7.0.0",
  "psycopg[c]==3.3.5",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "sentry-sdk==2.68.1",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
  "djlint==1.44.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "psycopg[c]==3.3.5",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.5",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
# pages/imprint.html is content pasted out of the old WordPress site and is
# structurally malformed (unbalanced <div>s, a <div> inside a <p>). Rewriting it
# is a content job rather than part of the cookiecutter upgrade, so it is
# excluded here until that content is redone.
extend_exclude = "ee_status/templates/pages/imprint.html"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
# H021: the breadcrumb navs set the `--bs-breadcrumb-divider` custom property,
# which can only be done with an inline style.
ignore = "H006,H021,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
# `mastr_data` was carried over unchanged from the pre-cookiecutter-upgrade
# codebase, so it trips a handful of the rules enabled above. These are real
# findings, not false positives; they are silenced here only so the upgrade
# itself stays a mechanical port, and are meant to be removed as the follow-up
# fixes land.
lint.per-file-ignores."ee_status/mastr_data/models.py" = [
  "DJ008",  # Model does not define `__str__`
  "RUF015", # Prefer `next(...)` over single element slice
]
lint.per-file-ignores."ee_status/mastr_data/views.py" = [
  # rankings_view builds its queryset from a pile of conditional kwargs and
  # wants splitting up; that refactor is deliberately not part of the bug fixes.
  "C901",    # `rankings_view` is too complex
  "PLR0912", # too many branches
  "PLR0915", # too many statements
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "ee_status/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
