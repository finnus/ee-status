# Production stack.
#
# Deployment is handled by Coolify, which runs its own reverse proxy and
# terminates TLS. It routes traffic to the `django` service on port 5000, so
# this file deliberately ships neither traefik nor nginx.
volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}

services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: ee_status_production_django
    depends_on:
      - postgres
      - redis
    # Coolify injects the configuration as environment variables, and
    # .envs/.production/ is gitignored so it is absent from its checkout.
    # These stay declared, marked optional, for a deploy by hand that does
    # create the files; a missing env_file is otherwise a hard error.
    env_file:
      - path: ./.envs/.production/.django
        required: false
      - path: ./.envs/.production/.postgres
        required: false
    # Coolify's proxy connects to this port; it is not published on the host.
    expose:
      - '5000'
    command: /start
    # Coolify only routes traffic to a container it considers healthy, and it
    # falls back to a curl-based probe when the compose file declares none --
    # the slim image has no curl, so declare our own. Python is on PATH, and
    # /health/ is exempted from the HTTPS redirect in config.settings.production.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r; r.urlopen("http://127.0.0.1:5000/health/", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      # collectstatic and the wait-for-postgres in the entrypoint run first.
      start_period: 90s

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: ee_status_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.production/.postgres
        required: false

  redis:
    image: docker.io/redis:8.10
